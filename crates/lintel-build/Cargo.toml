[package]
name = "lintel-build"
version = "0.1.1"
edition = "2024"
description = "Build and package Lintel desktop applications"
license = "MIT"
repository = "https://github.com/looading/lintel"
readme = "README.md"
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "src/**", "resources/**"]

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
cargo_metadata = "0.23.1"
ed25519-dalek = "2"
flate2 = { version = "1", optional = true }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false, optional = true }
tempfile = "3.24"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
plist = "1.8.0"

[target."cfg(windows)".dependencies]
windows-permissions = "0.2.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Security", "Win32_Storage_FileSystem"] }
winreg = { version = "0.55", features = ["transactions"] }

[features]
portable = ["dep:flate2", "dep:tar"]

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

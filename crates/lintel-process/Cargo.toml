[package]
name = "lintel-process"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/looading/lintel"
description = "Lifecycle integration for application-owned Mojo service processes"
readme = "README.md"
documentation = "https://docs.rs/lintel-process"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**"]

[workspace]

[dependencies]
lintel-crash = { version = "0.1.0", path = "../lintel-crash", default-features = false, optional = true }
mojo-ipc = "=0.3.0"
mojo-service = "=0.3.0"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lib]
path = "src/lib.rs"

[features]
crash-reporting = ["dep:lintel-crash"]

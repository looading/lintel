[package]
readme = "README.md"
description = "Schema-aware persistent settings and migrations for Lintel applications"
repository = "https://github.com/looading/lintel"
license = "MIT"
name = "lintel-lib-store"
version.workspace = true
edition = "2024"
metadata = { log_lovel = "info" }

[dependencies]
rkv.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tracing.workspace = true
lintel-lib-crypto.workspace = true
semver = { workspace = true, features = ["serde"] }

# 专门用于发布 store-reader 小体积 exe 的 profile
[profile.release-small]
inherits = "release"
debug = false
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1

[[example]]
name = "desk-store-example"
path = "examples/desk-store-example.rs"

[package]
name = "lintel-lib-config"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/looading/lintel"
description = "Generic runtime configuration and environment selection for Lintel applications"
readme = "README.md"
documentation = "https://docs.rs/lintel-lib-config"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**"]

[dependencies]
anyhow.workspace = true
lazy_static.workspace = true
once_cell.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yml.workspace = true
strum = { workspace = true, features = ["derive"] }
strum_macros.workspace = true
tracing.workspace = true
url.workspace = true
urlpattern.workspace = true
uuid.workspace = true
lintel-lib-event.workspace = true

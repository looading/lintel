[package]
name = "lintel-desktop-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Audited native permission and window-menu boundary for lintel-desktop"

[workspace]
resolver = "2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "warn"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
futures-channel = "0.3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSError", "NSObject", "NSURL"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationSettings", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
muda = "0.15.3"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30"

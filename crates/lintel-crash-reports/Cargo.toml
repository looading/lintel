[package]
name = "lintel-crash-reports"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/looading/lintel"
description = "Durable crash report queue and independent uploader for Lintel"
readme = "README.md"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**"]

[workspace]

[lints.rust]
unsafe_code = "forbid"

[dependencies]
cap-primitives = "4.0.3"
cap-std = "4.0.3"
httpdate = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["multipart", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["std"] }
rusqlite = { version = "0.42", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "sync", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

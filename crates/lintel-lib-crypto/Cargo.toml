[package]
readme = "README.md"
description = "Low-level cryptographic primitives retained for Lintel storage compatibility"
repository = "https://github.com/looading/lintel"
license = "MIT"
name = "lintel-lib-crypto"
version.workspace = true
edition = "2024"

[dependencies]
sha2.workspace = true
aes.workspace = true
aes-gcm.workspace = true
anyhow.workspace = true
hex.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }

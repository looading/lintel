[package]
name = "lintel-crash"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/looading/lintel"
description = "Local out-of-process native crash capture for Lintel applications"
readme = "README.md"
documentation = "https://docs.rs/lintel-crash"
include = ["Cargo.toml", "README.md", "LICENSE", "src/**", "tests/**"]
autobins = false
autotests = false

[workspace]

[lints.rust]
unsafe_code = "warn"

[[bin]]
name = "lintel-crash-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "lintel-snapshot-helper"
path = "src/bin/snapshot_helper.rs"

[[bin]]
name = "lintel-crash-probe"
path = "src/bin/probe.rs"
required-features = ["test-capture"]

[[test]]
name = "isolation"
path = "tests/isolation.rs"
required-features = ["test-capture"]

[features]
default = []
# Deliberate child-process abort probes are never part of a default install or test run.
test-capture = []

[dependencies]
anyhow = "1"
crash-handler = "0.8.1"
getrandom = "0.3"
minidumper = "0.11.0"
serde_json = "1"
tempfile = "3"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
libc = "0.2"
mach2 = "0.6"
minidump-writer = "=0.13.0"

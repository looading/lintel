[package]
name = "lintel-crash"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Local out-of-process native crash capture for Lintel applications"

[workspace]

[lints.rust]
unsafe_code = "warn"

[[bin]]
name = "lintel-crash-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "lintel-crash-probe"
path = "src/bin/probe.rs"

[dependencies]
anyhow = "1"
crash-handler = "0.8.1"
getrandom = "0.3"
minidumper = "0.11.0"
serde_json = "1"
tempfile = "3"

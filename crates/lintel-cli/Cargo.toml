[package]
name = "lintel-cli"
default-run = "lintel"
version = "0.1.0"
edition = "2024"
description = "Command-line tools for Lintel desktop applications"
license = "MIT"
repository = "https://github.com/looading/lintel"
readme = "resources/README.md"
include = [
  "Cargo.toml", "Cargo.lock", "LICENSE", "build.rs", "source_policy.rs", "src/**",
  "resources/README.md", "resources/LICENSE", "resources/framework-sources.json",
  "resources/prepare-release.py", "resources/lintel-framework.tar.gz", "resources/lintel-framework.sha256",
]

[[bin]]
name = "lintel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5.57", features = ["derive"] }
lintel-build = { version = "0.1.1", path = "../lintel-build", features = ["portable"] }
lintel-crash = { version = "0.1.0", path = "../lintel-crash" }
lintel-updater = { version = "0.1.1", path = "../lintel-updater" }
serde_json = "1"

[workspace]

[build-dependencies]
flate2 = "1"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.24"

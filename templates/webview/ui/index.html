<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file: 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Lintel WebView</title>
  <script src="lintel.js"></script>
  <style>
    body { margin: 0; padding: 40px; background: #edf5f2; color: #12342a; font: 18px system-ui; }
    main { max-width: 620px; padding: 28px; background: white; border: 1px solid #b0c9be; border-radius: 12px; }
    h1 { margin: 0 0 16px; }
    input, button { font: inherit; padding: 8px 12px; }
    button { cursor: pointer; }
    output { display: block; min-height: 24px; margin-top: 20px; font-weight: 600; }
    .accent { width: 64px; height: 6px; background: #e317ad; border-radius: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="accent" aria-hidden="true"></div>
    <h1>Lintel WebView</h1>
    <p>This local page calls a Rust command through the Lintel bridge.</p>
    <form>
      <label for="name">Name</label>
      <input id="name" value="Lintel">
      <button type="submit">Send to Rust</button>
    </form>
    <output id="reply" aria-live="polite">Waiting for Rust…</output>
  </main>
  <script>
    const form = document.querySelector('form');
    const reply = document.querySelector('#reply');

    async function greet() {
      try {
        reply.textContent = await window.lintel.invoke('greet', document.querySelector('#name').value);
      } catch (error) {
        reply.textContent = error.message;
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      void greet();
    });
    window.addEventListener('load', greet);
  </script>
</body>
</html>
